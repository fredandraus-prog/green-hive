name: Green Hive CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: green-hive-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and embedded isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source, packages, tests and database contracts
        run: npm run verify

      - name: Verify release manifest inventory and hashes
        run: npm run release:verify-manifest

      - name: Audit high-severity dependency findings
        run: npm audit --audit-level=high
